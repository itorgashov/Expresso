name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x
            10.0.x
      - name: Test
        run: dotnet test Expresso.slnx -c Release --nologo
      - name: Pack
        run: dotnet pack Expresso.slnx -c Release -o artifacts --nologo
