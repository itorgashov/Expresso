# Local integration-test databases (not used in CI)
#
#   docker compose -f docker/docker-compose.it.yml up -d
#   $env:EXPRESSO_IT = "1"
#   dotnet test test/Rendering/Expresso.Rendering.Integration.Test -c Release -f net6.0

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: expesso_it
      POSTGRES_PASSWORD: ExpessoPassword123
      POSTGRES_DB: expesso_it
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expesso_it
    ports:
      - "3306:3306"

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: expesso_it
    ports:
      - "3307:3306"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssw0rd1"
    ports:
      - "1433:1433"

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ExpessoPassword123
      APP_USER: expesso_it
      APP_USER_PASSWORD: ExpessoPassword123
    ports:
      - "1521:1521"

  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: Db2Password123
      DBNAME: expesso_it
    ports:
      - "50000:50000"
